<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141718"><title>IRON FRONT 鐵幕前線｜烈谷突襲</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="assets/insignia.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="duel.css"><link rel="stylesheet" href="radio.css"></head>
<body>
<header class="topbar">
  <div class="brand"><img src="assets/insignia.svg" alt=""><div><strong>IRON FRONT</strong><span>鐵 幕 前 線</span></div></div>
  <div class="topright"><button id="duelOpen" class="duel-entry">雙人對戰</button><div class="online"><i></i> 指揮鏈路連線中</div><span class="divider"></span><button class="iconbutton" id="installApp" hidden title="安裝鐵幕前線" aria-label="安裝鐵幕前線"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></button><button class="iconbutton" id="audioBtn" title="音效與配樂" aria-label="音效與配樂"><i data-icon="volume"></i></button><button class="iconbutton" id="helpBtn" title="戰術手冊" aria-label="戰術手冊"><i data-icon="book"></i></button><button class="pause" id="pauseBtn" aria-label="暫停戰役"><i data-icon="pause"></i><span>暫停</span></button></div>
</header>
<main>
<section class="missionbar"><div class="missionname"><span class="eyebrow"><b></b> OPERATION: CRIMSON RIFT</span><h1>烈谷突襲</h1></div>
<div class="resources">
<div class="res gold"><div class="resicon"><i data-icon="coins"></i></div><div><label>資金</label><strong id="credits">2,400</strong></div></div>
<div class="res green"><div class="resicon"><i data-icon="bolt"></i></div><div><label>基地電力</label><strong id="power">80<small>/120</small></strong></div></div>
<div class="res slate"><div class="resicon"><i data-icon="squad"></i></div><div><label>部隊規模</label><strong id="population">6<small>/24</small></strong></div></div>
</div></section>
<div class="workstation">
  <section class="fieldcol">
    <div class="fieldpanel">
      <div class="panelhead fieldhead"><span><i class="lucid" data-icon="reticle"></i> <span id="fieldLabel">戰場視圖</span></span><div class="digital"><button id="radioKey" hidden aria-label="戰場對講機，點按打字、長按說話" aria-expanded="false" aria-controls="fieldRadio" title="點按打字，長按或按住 V 說話"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 10V3m10 7V7M8 12h8m-7 4h6"/><rect x="5" y="8" width="14" height="14" rx="3"/></svg>對講</button><span class="live"><b></b> LIVE</span><i data-icon="clock"></i><time id="timer">00:00</time></div></div>
      <div id="view"><canvas id="battle" tabindex="0" aria-label="戰場。選取我軍後點地面移動或點敵軍攻擊"></canvas>
        <div id="radioStrip" role="status" aria-live="polite" hidden></div>
        <section id="fieldRadio" aria-label="戰場通訊" hidden>
          <header><strong>戰場通訊</strong><button id="radioClose" aria-label="關閉通訊">×</button></header>
          <div id="radioLog" role="log" aria-label="本局通訊紀錄"></div>
          <div id="radioQuick"><button>準備好了</button><button>橋頭見！</button><button>打得漂亮</button></div>
          <form id="radioForm"><input id="radioText" maxlength="160" aria-label="傳給對手的訊息" placeholder="傳給對手…" autocomplete="off" enterkeyhint="send"><button type="submit">傳送</button></form>
          <footer><label>收聽 <select id="radioListen"><option value="tap">點擊收聽</option><option value="auto">自動播放</option><option value="mute">靜音</option></select></label><button id="radioDictate" hidden>語音轉文字</button></footer>
          <small id="radioHint" role="status">長按對講鍵或按住 V 錄音，最多 5 秒。</small>
        </section>
        <button id="objective" title="檢視作戰任務"><i data-icon="flag"></i><div><b>主要目標</b><span>摧毀敵軍指揮部</span></div></button>
        <details id="duelVote" hidden open><summary>視野切換提議</summary><p></p><button id="voteYes">同意</button><button id="voteNo">維持現況</button></details><div id="notify" role="status" aria-live="polite"></div>
        <div id="modeTip" hidden><span></span><button aria-label="取消目前指令">×</button></div>
        <div class="maptools"><button id="homeBtn" title="返回基地（H）" aria-label="返回基地"><i data-icon="home"></i></button><b></b><button id="zoomOut" title="縮小戰場" aria-label="縮小戰場"><i data-icon="minus"></i></button><button id="zoomIn" title="放大戰場" aria-label="放大戰場"><i data-icon="plus"></i></button></div>
        <button id="mobileRadar" aria-label="切換雷達地圖"><i data-icon="radar"></i></button>
      </div>
    </div>
    <div class="selection">
      <div class="unitportrait"><canvas id="portrait" width="126" height="84"></canvas><span class="cross tl"></span><span class="cross br"></span></div>
      <div class="unitinfo"><div class="eyebrow" id="unitCode">T-04 / BATTLE TANK</div><h2 id="unitName">重裝戰車</h2><div class="hp"><span id="healthTrack"><b></b></span><small id="healthNum">260/260</small></div></div>
      <div class="cmds" id="cmds"></div>
    </div>
  </section>
  <aside class="side">
    <section class="radar panel"><div class="panelhead"><span><i data-icon="radar"></i> 戰術雷達</span><span class="panelen" id="radarMode">RADAR</span></div><div class="radarbody"><canvas id="radar" aria-label="戰術雷達，點選位置可移動鏡頭"></canvas><span class="north">N ▴</span><span class="radarsignal"><i></i><i></i><i></i><i></i></span></div><div class="radarlegend"><span><b></b><span id="radarFriend">我方</span></span><span><b></b><span id="radarFoe">敵方</span></span><span><b></b>礦區</span></div></section>
    <section class="production panel"><div class="panelhead"><span><i data-icon="factory"></i> <span id="productionLabel">生產指揮</span></span><span class="panelen">PRODUCTION</span><button id="mobileClose" aria-label="收起生產指揮">×</button></div>
      <div class="tabs"><button class="active" id="unitsTab"><i data-icon="tank"></i>單位</button><button id="buildTab"><i data-icon="build"></i>建築</button></div>
      <div id="catalog"></div>
      <div class="queuelabel"><span><i data-icon="queue"></i> 生產佇列</span><span id="qCount">0 / 6</span></div>
      <div id="queue"></div>
    </section>
  </aside>
</div>
<div class="mobileactions"><button id="mobileArmy"><i data-icon="squad"></i> 選取作戰部隊</button><button id="mobileBuild"><i data-icon="factory"></i> <span id="mobileProductionLabel">生產指揮</span></button></div>
</main>
<footer><div><span class="tinyLed"></span><span id="statusText">戰術系統就緒</span><small id="offlineStatus"></small></div><div class="tips"><span><kbd>LMB</kbd> 選取 / 框選</span><span><kbd>RMB</kbd> 下達指令</span><span><kbd>↑↓←→</kbd> 移動視野</span></div><button id="keysBtn"><i data-icon="keyboard"></i> 操作指南</button></footer>
<dialog id="dialog"><header><div><div class="eyebrow" id="dialogEyebrow"></div><h2 id="dialogTitle"></h2></div><button class="iconbutton" id="closeDialog" aria-label="關閉視窗"><i data-icon="x"></i></button></header><section id="dialogBody"></section></dialog>
<dialog id="duelPanel" aria-labelledby="roomTitle">
  <div class="room-heading"><i class="room-neutral" data-icon="radar"></i><img id="roomInsignia" hidden alt=""><div><small>IRON FRONT / MULTIPLAYER</small><h2 id="roomTitle">雙人對戰</h2><strong id="roomFaction" hidden></strong></div></div>
  <div id="roomBody"></div><p id="roomError" role="status"></p>
</dialog>
<script src="vendor/qrcode.js"></script><script src="duel-config.js"></script><script src="pwa.js"></script><script src="icons.js"></script><script src="terrain.js"></script><script src="sprites.js"></script><script src="engine.js"></script><script src="sound.js"></script><script src="game.js"></script><script src="radio-mic.js"></script><script src="radio.js"></script><script src="duel.js"></script>
</body></html>
